<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_classic-gst" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1" />
      <stop offset="100%" stop-color="#1f2937" stop-opacity="0.95" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="260" fill="#f8fafc" rx="8" />

  <!-- Sheet Shadow Card -->
  <rect x="50" y="20" width="300" height="220" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Invoice Top Accent Bar -->
  <rect x="50" y="20" width="300" height="38" rx="6" fill="url(#grad_classic-gst)" />
  <!-- Straighten bottom radius of top bar -->
  <rect x="50" y="52" width="300" height="6" fill="url(#grad_classic-gst)" />

  <!-- Header Title -->
  <text x="65" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">Classic GST</text>
  <rect x="280" y="32" width="55" height="15" rx="3" fill="#ffffff" fill-opacity="0.25" />
  <text x="307" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">A4 Full Height</text>

  <!-- Company & Customer Info Bars -->
  <rect x="65" y="70" width="110" height="7" rx="3" fill="#000000" />
  <rect x="65" y="82" width="80" height="5" rx="2" fill="#64748b" />
  <rect x="65" y="91" width="95" height="5" rx="2" fill="#94a3b8" />

  <rect x="235" y="70" width="100" height="7" rx="3" fill="#000000" />
  <rect x="255" y="82" width="80" height="5" rx="2" fill="#64748b" />
  <rect x="275" y="91" width="60" height="5" rx="2" fill="#94a3b8" />

  <!-- Separator Line -->
  <line x1="65" y1="106" x2="335" y2="106" stroke="#000000" stroke-width="1.5" />

  <!-- Table Header -->
  <rect x="65" y="114" width="270" height="14" rx="1" fill="#f1f5f9" stroke="#000000" stroke-width="0.8" />
  <rect x="72" y="118" width="50" height="6" rx="2" fill="#000000" />
  <rect x="180" y="118" width="25" height="6" rx="2" fill="#000000" />
  <rect x="240" y="118" width="30" height="6" rx="2" fill="#000000" />
  <rect x="300" y="118" width="25" height="6" rx="2" fill="#000000" />

  <!-- Table Rows -->
  <rect x="72" y="136" width="70" height="5" rx="2" fill="#334155" />
  <rect x="180" y="136" width="20" height="5" rx="2" fill="#64748b" />
  <rect x="240" y="136" width="25" height="5" rx="2" fill="#64748b" />
  <rect x="295" y="136" width="30" height="5" rx="2" fill="#000000" font-weight="bold" />

  <line x1="65" y1="148" x2="335" y2="148" stroke="#cbd5e1" stroke-width="0.8" stroke-dasharray="2 2" />

  <rect x="72" y="155" width="85" height="5" rx="2" fill="#334155" />
  <rect x="180" y="155" width="18" height="5" rx="2" fill="#64748b" />
  <rect x="240" y="155" width="25" height="5" rx="2" fill="#64748b" />
  <rect x="295" y="155" width="30" height="5" rx="2" fill="#000000" font-weight="bold" />

  <!-- Extended Table Grid Lines (Full Height) -->
  <line x1="65" y1="114" x2="65" y2="185" stroke="#000000" stroke-width="1" />
  <line x1="165" y1="114" x2="165" y2="185" stroke="#000000" stroke-width="0.8" />
  <line x1="225" y1="114" x2="225" y2="185" stroke="#000000" stroke-width="0.8" />
  <line x1="285" y1="114" x2="285" y2="185" stroke="#000000" stroke-width="0.8" />
  <line x1="335" y1="114" x2="335" y2="185" stroke="#000000" stroke-width="1" />
  <line x1="65" y1="185" x2="335" y2="185" stroke="#000000" stroke-width="1.5" />

  <!-- Total Summary Card -->
  <rect x="220" y="190" width="115" height="36" rx="4" fill="#000000" />
  <text x="230" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#94a3b8">TOTAL (INR)</text>
  <text x="230" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#ffffff">₹ 14,850.00</text>

  <!-- QR Stamp in Bottom Corner -->
  <rect x="65" y="195" width="28" height="28" rx="3" fill="#f8fafc" stroke="#000000" stroke-width="1" />
  <rect x="69" y="199" width="8" height="8" fill="#000000" />
  <rect x="81" y="199" width="8" height="8" fill="#000000" />
  <rect x="69" y="211" width="8" height="8" fill="#000000" />
  <rect x="81" y="211" width="4" height="4" fill="#000000" />
</svg>
