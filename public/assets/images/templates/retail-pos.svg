<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_retail-pos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.85" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="260" fill="#f8fafc" rx="8" />

  <!-- Sheet Shadow Card -->
  <rect x="50" y="20" width="300" height="220" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)" />

  <!-- Invoice Top Accent Bar -->
  <rect x="50" y="20" width="300" height="38" rx="6" fill="url(#grad_retail-pos)" />
  <!-- Straighten bottom radius of top bar -->
  <rect x="50" y="52" width="300" height="6" fill="url(#grad_retail-pos)" />

  <!-- Header Title -->
  <text x="65" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="0.5">Retail Slip</text>
  <rect x="280" y="32" width="55" height="15" rx="3" fill="#ffffff" fill-opacity="0.25" />
  <text x="307" y="43" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#ffffff" text-anchor="middle">A5 Compact</text>

  <!-- Company & Customer Info Bars -->
  <rect x="65" y="70" width="110" height="7" rx="3" fill="#0f172a" fill-opacity="0.75" />
  <rect x="65" y="82" width="80" height="5" rx="2" fill="#94a3b8" />
  <rect x="65" y="91" width="95" height="5" rx="2" fill="#cbd5e1" />

  <rect x="235" y="70" width="100" height="7" rx="3" fill="#d97706" />
  <rect x="255" y="82" width="80" height="5" rx="2" fill="#94a3b8" />
  <rect x="275" y="91" width="60" height="5" rx="2" fill="#cbd5e1" />

  <!-- Separator Line -->
  <line x1="65" y1="106" x2="335" y2="106" stroke="#e2e8f0" stroke-width="1" />

  <!-- Table Header -->
  <rect x="65" y="114" width="270" height="14" rx="2" fill="#f1f5f9" />
  <rect x="72" y="118" width="50" height="6" rx="2" fill="#64748b" />
  <rect x="180" y="118" width="25" height="6" rx="2" fill="#64748b" />
  <rect x="240" y="118" width="30" height="6" rx="2" fill="#64748b" />
  <rect x="300" y="118" width="25" height="6" rx="2" fill="#64748b" />

  <!-- Table Rows -->
  <rect x="72" y="136" width="70" height="5" rx="2" fill="#334155" />
  <rect x="180" y="136" width="20" height="5" rx="2" fill="#64748b" />
  <rect x="240" y="136" width="25" height="5" rx="2" fill="#64748b" />
  <rect x="295" y="136" width="30" height="5" rx="2" fill="#0f172a" font-weight="bold" />

  <line x1="65" y1="148" x2="335" y2="148" stroke="#f1f5f9" stroke-width="1" />

  <rect x="72" y="155" width="85" height="5" rx="2" fill="#334155" />
  <rect x="180" y="155" width="18" height="5" rx="2" fill="#64748b" />
  <rect x="240" y="155" width="25" height="5" rx="2" fill="#64748b" />
  <rect x="295" y="155" width="30" height="5" rx="2" fill="#0f172a" font-weight="bold" />

  <line x1="65" y1="167" x2="335" y2="167" stroke="#f1f5f9" stroke-width="1" />

  <rect x="72" y="174" width="60" height="5" rx="2" fill="#334155" />
  <rect x="180" y="174" width="22" height="5" rx="2" fill="#64748b" />
  <rect x="240" y="174" width="25" height="5" rx="2" fill="#64748b" />
  <rect x="295" y="174" width="30" height="5" rx="2" fill="#0f172a" font-weight="bold" />

  <!-- Total Summary Card -->
  <rect x="220" y="190" width="115" height="36" rx="4" fill="#d97706" fill-opacity="0.08" stroke="#d97706" stroke-opacity="0.2" stroke-width="1" />
  <text x="230" y="204" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="600" fill="#475569">TOTAL (INR)</text>
  <text x="230" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#d97706">₹ 14,850.00</text>

  <!-- QR Stamp in Bottom Corner -->
  <rect x="65" y="195" width="28" height="28" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
  <rect x="69" y="199" width="8" height="8" fill="#d97706" />
  <rect x="81" y="199" width="8" height="8" fill="#d97706" />
  <rect x="69" y="211" width="8" height="8" fill="#d97706" />
  <rect x="81" y="211" width="4" height="4" fill="#d97706" />
</svg>